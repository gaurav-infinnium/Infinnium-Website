<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<app-navbar></app-navbar>

<section class="bg-gray-100 py-10 px-4 sm:px-6 lg:px-8">
    <div class="mt-[3rem] max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Add News and Events</h2>

        <form [formGroup]="blogForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Left side: Title, Brief, Date -->
                <div class="md:col-span-2 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                        <input type="text" formControlName="title"
                            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        <div *ngIf="blogForm.get('title')?.touched && blogForm.get('title')?.invalid"
                            class="text-sm text-red-500 mt-1">
                            Title is required and must be under 100 characters.
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Brief</label>
                        <input type="text" formControlName="brief"
                            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        <div *ngIf="blogForm.get('brief')?.touched && blogForm.get('brief')?.invalid"
                            class="text-sm text-red-500 mt-1">
                            Brief is required and must be under 150 characters.
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Published Date</label>
                        <input type="date" formControlName="publishedDate"
                            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        <div *ngIf="blogForm.get('publishedDate')?.touched && blogForm.get('publishedDate')?.invalid"
                            class="text-sm text-red-500 mt-1">
                            Published date is required.
                        </div>
                    </div>
                </div>

                <!-- Right side: Image Preview and Upload -->
                <div class="flex flex-col items-center justify-start space-y-4">
                    <div class="w-full aspect-[4/3] overflow-hidden border border-gray-300 rounded-lg flex items-center justify-center bg-gray-50">
                        <img *ngIf="previewUrl" [src]="previewUrl" alt="News Image" class="object-cover w-full h-full" />
                        <div *ngIf="!previewUrl" class="flex flex-col items-center gap-2">
                            <svg class="w-14 h-14 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span class="text-xs text-gray-400">No image selected</span>
                        </div>
                    </div>
                    <div class="w-full">
                        <label class="block text-sm font-medium text-gray-700">Upload Image</label>
                        <input type="file" accept="image/*" (change)="onFileChange($event)"
                            class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:rounded-full file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        <div *ngIf="blogForm.get('image')?.touched && blogForm.get('image')?.invalid"
                            class="text-sm text-red-500 mt-1">
                            Image is required.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <quill-editor formControlName="description"
                    class="w-full rounded-lg bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    [modules]="{ toolbar: [['bold', 'italic'], ['link', 'blockquote', 'code-block'], [{ 'list': 'ordered'}, { 'list': 'bullet' }]] }">
                </quill-editor>
                <div *ngIf="blogForm.get('description')?.touched && blogForm.get('description')?.invalid"
                    class="text-sm text-red-500 mt-1">
                    Description is required.
                </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-3 pt-4">
                <button type="button" (click)="cancel()"
                    class="flex-1 border border-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-50 focus:outline-none font-medium cursor-pointer">
                    Cancel
                </button>
                <button type="submit"
                    class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 font-medium cursor-pointer">
                    Publish News
                </button>
            </div>
        </form>
    </div>
</section>

<div *ngIf="showPopup"
    class="fixed inset-0 bg-transparent bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm">
        <h3 class="text-xl font-semibold mb-4">News Published!</h3>
        <p class="mb-6">Your news has been successfully published.</p>
        <button (click)="closePopup()"
            class="border-[1.5px] border-blue-600 text-white px-6 py-2 rounded-3xl overflow-hidden transition-all duration-300 ease-in-out cursor-pointer bg-blue-600 hover:bg-blue-700">
            OK
        </button>
    </div>
</div>

<app-footer></app-footer>
