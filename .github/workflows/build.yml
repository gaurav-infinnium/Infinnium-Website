name: Build and Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infinnium_website.client/package-lock.json

      # Angular's build (invoked via the Microsoft.VisualStudio.JavaScript.Sdk
      # during `dotnet publish`) reads the intermediate `obj/Debug` folder and
      # fails with "TS500 : ENOENT ... obj/Debug" if it does not exist on a
      # fresh CI checkout. Pre-creating the folder avoids that failure.
      - name: Prepare client intermediate output directory
        run: mkdir -p infinnium_website.client/obj/Debug

      # Server.csproj's PublishAngular target references '..\Infinnium_Website.Client'
      # (backslash + upper-case), which fails on case-sensitive Linux filesystems
      # where the actual folder is 'infinnium_website.client'. A symlink makes
      # both spellings resolve to the same directory.
      - name: Create case-compatible client symlink
        run: ln -sfn infinnium_website.client Infinnium_Website.Client

      - name: Restore .NET dependencies
        run: dotnet restore Infinnium_Website.Server/Infinnium_Website.Server.csproj

      - name: Publish application
        run: |
          dotnet publish Infinnium_Website.Server/Infinnium_Website.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --framework net8.0 \
            --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinnium-website-publish
          path: ./publish
          retention-days: 30
