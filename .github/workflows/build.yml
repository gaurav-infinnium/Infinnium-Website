name: Build and Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infinnium_website.client/package-lock.json

      - name: Install client npm dependencies
        working-directory: infinnium_website.client
        run: npm ci

      - name: Build Angular client
        working-directory: infinnium_website.client
        run: npm run build -- --configuration production --output-path=../Infinnium_Website.Server/wwwroot

      - name: Create case-compatible symlink for PublishAngular target
        # Server.csproj's PublishAngular target references '..\Infinnium_Website.Client'
        # which fails on case-sensitive Linux filesystems (actual dir is lowercase).
        run: ln -sfn infinnium_website.client Infinnium_Website.Client

      - name: Restore .NET dependencies (server)
        run: dotnet restore Infinnium_Website.Server/Infinnium_Website.Server.csproj

      - name: Build server
        run: |
          dotnet build Infinnium_Website.Server/Infinnium_Website.Server.csproj \
            --configuration Release \
            --no-restore \
            -p:BuildProjectReferences=false

      - name: Publish application
        run: |
          dotnet publish Infinnium_Website.Server/Infinnium_Website.Server.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -p:BuildProjectReferences=false \
            --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinnium-website-publish
          path: ./publish
          retention-days: 30
